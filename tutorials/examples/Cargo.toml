[package]
name = "recipe-tutorial"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "recipe-tutorial"
path = "main.rs"

[dependencies]
deepseek-recipe = { path = "../../deepseek-recipe" }
deepseek-recipe-encoding = { path = "../../deepseek-recipe-encoding" }
serde_json = "1"
tokenizers = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
